# Managed production entry point; real scanner authorization remains evidence-gated.
spring:
  config:
    import: optional:file:${EXTERNAL_SERVICES_CONFIG:./config/external-services.local.yml}
  lifecycle:
    timeout-per-shutdown-phase: 1s
  main:
    web-application-type: servlet
  web:
    resources:
      static-locations: classpath:/managed-ui/
  mvc:
    log-request-details: false
server:
  address: ${ADMIN_ADDRESS:127.0.0.1}
  port: ${ADMIN_PORT:8680}
  forward-headers-strategy: none
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: TALKWEAVE_ADMIN
        http-only: true
        same-site: strict
        secure: ${ADMIN_COOKIE_SECURE:false}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB
assistant:
  enabled: false
managed:
  conversation:
    time-zone: ${CONVERSATION_TIME_ZONE:Asia/Shanghai}
  health-port: ${HEALTH_PORT:8081}
  materials-directory: ${MANAGED_MATERIALS_DIR:./materials}
  bootstrap-username: ${ADMIN_INIT_USERNAME:${ADMIN_INITIAL_USERNAME:admin}}
  bootstrap-password: ${ADMIN_INIT_PASSWORD:${ADMIN_INITIAL_PASSWORD:}}
