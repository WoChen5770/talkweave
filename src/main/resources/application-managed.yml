# Development entry point while the multi-user runtime is being implemented.
spring:
  main:
    web-application-type: servlet
  web:
    resources:
      static-locations: classpath:/managed-ui/
  mvc:
    log-request-details: false
server:
  address: ${ADMIN_ADDRESS:127.0.0.1}
  port: ${ADMIN_PORT:8080}
  forward-headers-strategy: none
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: TALKWEAVE_ADMIN
        http-only: true
        same-site: strict
        secure: ${ADMIN_COOKIE_SECURE:false}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB
assistant:
  enabled: false
managed:
  health-port: ${HEALTH_PORT:8081}
  directory: ${MANAGED_DATA_DIR:./data-managed}
  bootstrap-username: ${ADMIN_INITIAL_USERNAME:admin}
  bootstrap-password: ${ADMIN_INITIAL_PASSWORD:}
